name: CI

# Two jobs, split on whether the check needs the gf180mcu PDK / xschem:
#
#   checks       -- headless, no PDK/xschem/ngspice download. Runs on every
#                   push to main and every PR. Must stay green and fast.
#   pdk-checks   -- needs xschem + ngspice + a ~5 GB PDK install (via ciel).
#                   Kept off the default PR path per #30: nightly schedule +
#                   manual dispatch only, so no PR is ever blocked on a PDK
#                   download.
#
# Self-check inventory (verified against the repo at implementation time --
# see #30):
#   - sim/build_tb.py --check                -> checks (pure stdlib python; it
#                                               compares committed testbench
#                                               fragments against the committed
#                                               design/netlist/*.spice exports,
#                                               so it needs no PDK. The other
#                                               half of that chain,
#                                               design/netlist.py --check, does
#                                               need xschem + PDK and stays in
#                                               pdk-checks below.)
#   - sim/tests/*  (unittest, no PDK)        -> checks / sim/selftest.sh step 1
#   - sim/selftest.sh end-to-end PVT smoke   -> checks (auto-skips without a
#                                               PDK) AND re-asserted with
#                                               --require-pdk in pdk-checks
#   - layout/tests/* (unittest, no PDK/klt)  -> checks, dedicated step (issue
#                                               #64), PLUS a second pass on
#                                               3.11 after the klt grader
#                                               install so klayout-gated
#                                               tests execute instead of
#                                               skipping (#645);
#                                               package.json's "test"
#                                               script runs the same suite by
#                                               hand but CI does not invoke
#                                               npm, so it is also run here
#                                               directly.
#   - layout/check_gds_grid.py               -> checks / 3.11 only (issue #553;
#                                               needs the `klayout` python
#                                               module, which the klt grader
#                                               install below already pulls
#                                               in -- no new pip install).
#   - layout/postlayout.py --check (#573)    -> checks, both legs. Stdlib only:
#                                               regenerates the
#                                               layout/postlayout/ artifacts in
#                                               memory and byte-compares them
#                                               against what is committed, so
#                                               it binds the postlayout exports
#                                               to the committed
#                                               layout/cells/*.gds.
#   - layout/build_cells.py --check (#573)   -> checks, 3.11 leg. Rebuilds every
#                                               cell into a temp dir and
#                                               byte-compares against the
#                                               committed layout/cells/*.gds --
#                                               the generator -> GDS link of
#                                               the staleness chain. Needs the
#                                               klayout python module, which it
#                                               gets transitively from the
#                                               klayout-tools[yield] install
#                                               below; a missing module raises
#                                               and the step fails (no skip).
#   - signoff/check.py                       -> checks (issue #301). Re-grades
#                                               signoff/block-manifest.json with
#                                               `klt signoff --manifest` and
#                                               fails on any drift from the
#                                               committed signoff/tier-report.json.
#                                               Needs `klt` on PATH but NO PDK:
#                                               --manifest only reads committed
#                                               JSON envelopes, it never runs a
#                                               layout tool. The klt it needs is
#                                               the GRADER pin in
#                                               signoff/toolchain.json, which is
#                                               deliberately NOT layout/toolchain.json's
#                                               evidence-producer pin.
#   - Python matrix (issue #354)             -> checks runs on 3.9 (the documented
#                                               floor) and 3.11. The stdlib-only
#                                               steps run on both; the klt grader
#                                               install, layout/check_gds_grid.py,
#                                               signoff/check.py and
#                                               layout/build_cells.py --check
#                                               run on 3.11 only.
#   - design/netlist.py --check              -> pdk-checks (needs xschem + PDK)
#   - "any pytest under sim/"                -> none exists; sim/tests/ is
#                                               unittest-based, exercised by
#                                               sim/selftest.sh step 1 above.
#   - sim/devchar/run_devchar.py row-count
#     guard (issue #24)                      -> covered: sim/tests/test_run_devchar.py
#                                               exercises CsvWriter's append-time
#                                               row-count verification (no PDK
#                                               needed), run by the same
#                                               sim/selftest.sh step 1 as the rest
#                                               of sim/tests/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # PDK-dependent job only (see the `if:` gate below); nothing here reruns
    # the headless `checks` job on a schedule.
    - cron: "17 6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (headless -- no PDK/xschem)
    # Pinned: ubuntu-latest moved to 26.04, and the actions/python-versions
    # manifest has no 3.9 build for it (#379). Revisit when the manifest gains
    # one or the 3.9 floor is dropped.
    runs-on: ubuntu-24.04
    if: github.event_name != 'schedule'
    # 3.9 is the documented floor for the stdlib-only harness (README
    # Prerequisites, #354); 3.11 is what the klt-based grader steps run on.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the PR base is reachable for the merge-base in
          # sim/check_append_only.py (the default shallow merge-commit
          # checkout cannot compute one).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: sim/check_append_only.py (PR must not edit, delete or move existing sim/ evidence)
        if: github.event_name == 'pull_request'
        # #353. Stdlib-only; no bypass -- correct evidence with a superseding record.
        run: python3 sim/check_append_only.py --base origin/${{ github.base_ref }}

      - name: layout/postlayout.py --check (postlayout exports + audit match the committed GDS)
        # #573. Stdlib only, so it runs on both matrix legs. Regenerates the
        # layout/postlayout/ artifacts in memory and byte-compares them against
        # what is committed, binding them to the committed layout/cells/*.gds.
        run: python3 layout/postlayout.py --check

      - name: sim/build_tb.py --check (testbench fragments match the exported netlists)
        run: python3 sim/build_tb.py --check

      - name: sim/selftest.sh (harness unit tests; PVT smoke auto-skips without a PDK)
        run: bash sim/selftest.sh

      # Per-suite steps give separate logs; `make test` in the Makefile is the
      # source of truth for which suites exist -- keep these in sync with it.
      - name: layout/tests (lvs_reference.py transform unit tests, no PDK/klt)
        run: python3 -m unittest discover -s layout/tests -t layout/tests

      - name: signoff/tests (ERC freshness gate unit tests, no PDK/klt)
        run: python3 -m unittest discover -s signoff/tests -t signoff/tests

      - name: scripts/tests (artifact-manifest check unit tests, no broker/klt)
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: "scripts/check_artifact_manifests.py (manifest schema, artifact: URIs, no committed stored bytes)"
        # DR-030. Needs neither the broker nor klt; `klt artifact verify` is a
        # fleet-worker check, not a public-CI one.
        run: python3 scripts/check_artifact_manifests.py

      - name: Install the pinned signoff grader (klt -- no PDK needed)
        if: matrix.python-version == '3.11'
        # signoff/toolchain.json pins the klt build that GRADES this block.
        # It is a different pin from layout/toolchain.json's, which pins the
        # build that PRODUCED layout/reports/ -- see signoff/toolchain.json
        # for why the two cannot be the same version.
        run: pip install "klayout-tools[yield]==0.9.1"

      - name: layout/tests, again, with klayout (gated tests execute, not skip)
        if: matrix.python-version == '3.11'
        # #645. The layout/tests step above runs on both matrix legs BEFORE
        # klayout is installed, so every skipUnless(klayout) test in it
        # silently skips there -- a green run of that step is not evidence the
        # klayout-gated negative controls executed. This second pass runs
        # after the grader install above, which guarantees the klayout module
        # (an install failure fails the job first), so a klayout skip cannot
        # happen silently. This step is what makes a skipUnless(klayout) test
        # safe to add anywhere under layout/tests: it re-runs the whole
        # directory rather than a file list, so a new gated test is covered
        # here with no list to keep up. -v makes any skip visible per-test in
        # the log.
        run: python3 -m unittest discover -s layout/tests -t layout/tests -v

      - name: layout/check_gds_grid.py (every committed GDS vertex on the manufacturing grid)
        if: matrix.python-version == '3.11'
        # #553. Layer- and deck-version-agnostic end-product guard: reads the
        # committed layout/cells/*.gds directly and requires every vertex to
        # be a whole multiple of build_cells.MFG_GRID_UM. Needs only the
        # `klayout` python module, which the grader install above already
        # pulls in (klayout-tools depends on klayout>=0.30) -- no new pip
        # install. It cannot live in the pre-install layout/tests unittest
        # step above: that step runs on both matrix entries before klayout
        # is installed, so a skipUnless(klayout) test would silently skip
        # there instead of guarding anything. That hazard is closed by the
        # "layout/tests, again, with klayout" step above: it re-runs the
        # suite after the grader install, which is what makes a
        # skipUnless(klayout) test safe to add anywhere under layout/tests.
        run: python3 layout/check_gds_grid.py

      - name: layout/build_cells.py --check (committed GDS reproduces from the generator)
        if: matrix.python-version == '3.11'
        # #573. Rebuilds every cell into a temp dir and byte-compares against
        # the committed layout/cells/*.gds: the generator -> GDS link of the
        # build_cells -> GDS -> postlayout -> testbench staleness chain, whose
        # last link sim/build_tb.py --check already gates above. Needs the
        # klayout python module, which comes transitively from the
        # klayout-tools[yield] install above. With the module absent the
        # import raises and this step fails -- it cannot pass vacuously.
        run: python3 layout/build_cells.py --check

      - name: signoff/check.py (re-grade the T1 manifest; fail on evidence rot)
        if: matrix.python-version == '3.11'
        run: python3 signoff/check.py

      - name: signoff/yield_samples.py --check (item 6 sample sets match the committed MC logs)
        if: matrix.python-version == '3.11'
        run: python3 signoff/yield_samples.py --check

  pdk-checks:
    name: pdk-checks (netlist export + full PVT smoke)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice

      - name: Build and install xschem 3.4.7 from source (#89)
        # Ubuntu 24.04's apt package (xschem 3.4.4-1) has a top_is_subckt
        # regression: it fails to wrap the top-of-invocation cell as an
        # active .subckt (emits a double-comment-prefixed **.subckt/**.ends
        # instead), even though design/xschemrc sets top_is_subckt 1. Every
        # sub-cell hits the same bug when netlisted on its own, since each is
        # the "top of invocation" for its own xschem run. xschem 3.4.7 does
        # not have this defect and reproduces design/netlist/*.spice
        # byte-for-byte -- see design/README.md's Requirements note and
        # issue #89 for the full root cause. Building from source keeps CI
        # pinned to a known-good version instead of following whatever
        # xschem apt ships next.
        run: |
          sudo apt-get install -y build-essential libcairo2-dev libx11-dev \
            libxpm-dev tcl8.6-dev tk8.6-dev
          curl -sL https://github.com/StefanSchippers/xschem/archive/refs/tags/3.4.7.tar.gz \
            -o /tmp/xschem-3.4.7.tar.gz
          tar xzf /tmp/xschem-3.4.7.tar.gz -C /tmp
          (cd /tmp/xschem-3.4.7 && ./configure && make -j"$(nproc)" && sudo make install)
          xschem --version | grep -q 'XSCHEM V3.4.7' || {
            echo "expected xschem 3.4.7, got:" >&2
            xschem --version >&2
            exit 1
          }

      - name: Install the gf180mcu PDK (ciel)
        run: |
          pip install ciel
          # DR-032 (issue #602): open_pdks f6eeac7d is the authoritative
          # revision for sim/ evidence, so CI grades the same device models
          # the dispatch fleet and klt resolve. Records minted against the
          # pre-DR-032 build stay valid as history and name their own
          # build in their provenance.
          ciel enable --pdk gf180mcu f6eeac7dad085ffcc829ccfd721f7b4ce39edcf7
          # Select this install explicitly: sim/harness/pdk.py's built-in
          # search order still lists ~/.volare first on main (reordering it
          # is PR #601's change), so point the harness straight at the ciel
          # variant directory instead of relying on search order.
          echo "GF180_PDK_PATH=$HOME/.ciel/gf180mcuD" >> "$GITHUB_ENV"

      - name: Install klt (netlist export front-end for design/netlist.py)
        # design/netlist.py shells out to `klt netlist`, which owns the xschem
        # invocation. This pin is separate from the signoff grader pin in
        # signoff/toolchain.json: it only needs a release that provides
        # `klt netlist`, and is bumped on the netlist export's own schedule.
        run: pip install "klayout-tools==0.7.0"

      - name: design/netlist.py --check (deterministic-netlist staleness guard)
        run: python3 design/netlist.py --check

      - name: sim/selftest.sh --require-pdk (full end-to-end PVT smoke, no evidence written)
        run: bash sim/selftest.sh --require-pdk
